<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسار | MASAR</title>
    <link rel="manifest" href="manifest.json?v=3">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; padding-bottom: 80px; }
        .hide { display: none !important; }
        #map, #driverMap, #clientOrderMap, #adminLiveMap { height: 220px; width: 100%; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ccc; z-index: 0; }
        .custom-truck-icon { font-size: 24px; text-align: center; line-height: 24px; }
        .star-btn { font-size: 24px; cursor: pointer; color: #d1d5db; transition: 0.2s; }
        .star-btn.active { color: #f59e0b; }
    </style>
</head>
<body>

    <header class="bg-gray-900 text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center gap-3">
            <div class="bg-yellow-500 text-black font-black text-xl rounded-lg w-10 h-10 flex items-center justify-center">M</div>
            <h1 class="text-xl font-bold">مسار <span class="text-yellow-500 text-sm">MASAR</span></h1>
        </div>
        <button onclick="logout()" id="logoutBtn" class="hide text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded">خروج</button>
    </header>

    <main class="max-w-md mx-auto p-4">
        
        <div id="authScreen" class="hide bg-white p-6 rounded-2xl shadow-lg mt-10">
            <h2 class="text-2xl font-bold text-center mb-6">دخول / حساب جديد</h2>
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-3 border rounded-lg mb-3" dir="ltr">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-3 border rounded-lg mb-3" dir="ltr">
            <select id="role" class="w-full p-3 border rounded-lg mb-3 bg-gray-50">
                <option value="client">عميل (أطلب شحنة)</option>
                <option value="driver">سائق (أستلم شحنات)</option>
            </select>
            <input type="text" id="name" placeholder="الاسم بالكامل" class="w-full p-3 border rounded-lg mb-3">
            <input type="text" id="phone" placeholder="رقم الهاتف" class="w-full p-3 border rounded-lg mb-3" dir="ltr">
            <button onclick="handleAuth()" id="authBtn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold p-3 rounded-lg transition">دخول</button>
        </div>

        <div id="approvalScreen" class="hide text-center bg-white p-6 rounded-2xl shadow-lg mt-10">
            <div class="text-5xl mb-4">⏳</div>
            <h2 class="text-xl font-bold text-red-600 mb-4">حسابك قيد المراجعة</h2>
        </div>

        <div id="clientScreen" class="hide">
            <div class="bg-white p-5 rounded-2xl shadow-sm mb-4 flex justify-between items-center">
                <div>
                    <p class="text-gray-500 text-sm">رصيد المحفظة</p>
                    <p class="text-2xl font-bold text-green-600" id="clientWallet">0 ج.م</p>
                </div>
                <button onclick="topUpWallet()" class="bg-black text-white px-4 py-2 rounded-lg text-sm">+ شحن</button>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm mb-4">
                <h3 class="font-bold text-lg mb-4 text-gray-800">طلب شحنة جديدة</h3>
                <input type="text" id="pickup" placeholder="عنوان التحميل" class="w-full p-2 border rounded-lg mb-2">
                <input type="text" id="dropoff" placeholder="عنوان التسليم" class="w-full p-2 border rounded-lg mb-2">
                <select id="payment_method" class="w-full p-2 border rounded-lg mb-2 bg-gray-50 font-bold text-blue-700">
                    <option value="cash">💵 الدفع نقداً (كاش)</option>
                    <option value="wallet">💰 خصم من المحفظة</option>
                </select>
                
                <div id="map"></div>
                <p class="text-xs text-gray-500 mb-2">📍 دوس على الخريطة لتحديد مكان التحميل</p>

                <button onclick="createOrder()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold p-3 rounded-lg mt-2">تأكيد الطلب</button>
            </div>

            <h3 class="font-bold text-lg mb-2 text-gray-800 mt-6">شحناتي</h3>
            <div id="clientOrders"></div>
        </div>

        <div id="driverScreen" class="hide">
            <div class="bg-gray-900 text-white p-5 rounded-2xl shadow-sm mb-4 flex justify-between items-center">
                <div>
                    <p class="text-gray-400 text-sm">صافي الأرباح</p>
                    <p class="text-2xl font-bold text-yellow-500" id="driverWallet">0 ج.م</p>
                </div>
                <button onclick="renderDriverOrders()" class="bg-gray-700 text-white px-3 py-1 rounded text-sm hover:bg-gray-600">🔄 تحديث</button>
            </div>

            <h3 class="font-bold text-lg mb-2 text-gray-800 mt-6">رحلاتي الحالية</h3>
            <div id="driverMyOrders"></div>

            <h3 class="font-bold text-lg mb-2 text-gray-800 mt-6">طلبات متاحة</h3>
            <div id="driverPendingOrders" class="pb-10"></div>
        </div>

        <div id="adminScreen" class="hide">
            <div class="bg-gray-900 text-white p-5 rounded-2xl shadow-sm mb-4 text-center">
                <h2 class="text-2xl font-bold text-yellow-500">لوحة تحكم الإدارة 🛡️</h2>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border-r-4 border-blue-500">
                <h3 class="font-bold text-lg mb-2 text-blue-800">تتبع الشحنات النشطة لحظياً 📍</h3>
                <div id="adminLiveTracking"></div>
            </div>

            <h3 class="font-bold text-lg mb-2 text-gray-800 mt-6">المستخدمين</h3>
            <div id="adminUsersList" class="mb-6"></div>
            
            <h3 class="font-bold text-lg mb-2 text-gray-800 mt-6">سجل الطلبات</h3>
            <div id="adminOrdersList"></div>
        </div>

    </main>

    <a href="https://wa.me/201008781263" target="_blank" class="fixed bottom-4 left-4 bg-green-500 text-white p-4 rounded-full shadow-lg z-50 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
    </a>

    <script>
        const SUPABASE_URL = 'https://jzcwocvkqbuhpactazus.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ndfcyfS3Mz90d5_E-LQnbg_FW-cyLsJ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;
        let currentProfile = null;
        
        let map = null, marker = null;
        let driverMap = null, driverRouting = null;
        let selectedLat = 30.0444, selectedLng = 31.2357;
        let watchId = null;
        let driverPollingInterval = null; // متغير للتحديث التلقائي

        const formatMoney = (num) => Number(num || 0).toLocaleString('ar-EG') + ' ج.م';

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value || 'مستخدم';
            const phone = document.getElementById('phone').value || 'غير مسجل';
            const role = document.getElementById('role').value;

            if(!email || !password) return alert('اكتب الإيميل والباسورد');

            const btn = document.getElementById('authBtn');
            btn.disabled = true;
            btn.innerText = 'جاري الدخول...';

            try {
                let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                
                if (error && error.message.includes('Invalid login credentials')) {
                    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email, password });
                    if (signUpError) throw signUpError;
                    
                    await supabaseClient.from('profiles').insert({
                        id: signUpData.user.id, full_name: name, phone: phone, role: role,
                        wallet_balance: role === 'driver' ? 0 : 2500, approved: role === 'client'
                    });
                    
                    alert('تم إنشاء الحساب بنجاح!');
                    setTimeout(() => loadApp(signUpData.user), 1000);
                } else if (error) {
                    throw error;
                } else {
                    loadApp(data.user);
                }
            } catch (err) { 
                alert('خطأ: ' + err.message); 
                btn.disabled = false;
                btn.innerText = 'دخول';
            }
        }

        async function loadApp(user) {
            if(!user) return showScreen('authScreen');
            currentUser = user;
            try {
                let { data } = await supabaseClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
                if (!data) {
                    const { data: newProfile } = await supabaseClient.from('profiles').insert({
                        id: user.id, full_name: user.email.split('@')[0], role: 'client', wallet_balance: 2500, approved: true
                    }).select().single();
                    data = newProfile;
                }

                currentProfile = data;
                document.getElementById('logoutBtn').classList.remove('hide');
                document.getElementById('authBtn').disabled = false;
                document.getElementById('authBtn').innerText = 'دخول';
                
                if(data.role === 'client') {
                    document.getElementById('clientWallet').innerText = formatMoney(data.wallet_balance);
                    showScreen('clientScreen');
                    renderClientOrders();
                    setTimeout(initClientMap, 200);
                } else if(data.role === 'driver') {
                    if(!data.approved) showScreen('approvalScreen');
                    else {
                        document.getElementById('driverWallet').innerText = formatMoney(data.wallet_balance);
                        showScreen('driverScreen');
                        renderDriverOrders();
                        
                        // تشغيل التحديث التلقائي كل 10 ثواني عشان يشوف الطلبات الجديدة
                        if (driverPollingInterval) clearInterval(driverPollingInterval);
                        driverPollingInterval = setInterval(renderDriverOrders, 10000);
                    }
                } else if(data.role === 'admin') {
                    showScreen('adminScreen');
                    loadAdminData();
                }
            } catch (err) { showScreen('authScreen'); }
        }

        async function topUpWallet() {
            const amount = prompt('أدخل المبلغ اللي عايز تشحنه (بالجنيه):');
            if(!amount || isNaN(amount) || amount <= 0) return;
            
            const confirmPay = confirm(`هل أنت متأكد من دفع ${amount} ج.م بالفيزا/فوري؟ (محاكاة)`);
            if(!confirmPay) return;

            let newBalance = Number(currentProfile.wallet_balance) + Number(amount);
            await supabaseClient.from('profiles').update({ wallet_balance: newBalance }).eq('id', currentUser.id);
            
            currentProfile.wallet_balance = newBalance;
            document.getElementById('clientWallet').innerText = formatMoney(newBalance);
            alert('تم شحن المحفظة بنجاح! ✅');
        }

        async function submitRating(orderId, stars) {
            await supabaseClient.from('orders').update({ rating: stars }).eq('id', orderId);
            alert('شكراً لتقييمك! ⭐');
            renderClientOrders();
        }

        function initClientMap() {
            if (!document.getElementById('map')) return;
            if (map) { map.remove(); map = null; }
            map = L.map('map').setView([selectedLat, selectedLng], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([selectedLat, selectedLng], {draggable: true}).addTo(map);
            marker.on('dragend', e => { selectedLat = e.target.getLatLng().lat; selectedLng = e.target.getLatLng().lng; });
            map.on('click', e => { marker.setLatLng(e.latlng); selectedLat = e.latlng.lat; selectedLng = e.latlng.lng; });
        }

        async function createOrder() {
            const pickup = document.getElementById('pickup').value;
            const dropoff = document.getElementById('dropoff').value;
            const payMethod = document.getElementById('payment_method').value;

            if(!pickup || !dropoff) return alert('ادخل العناوين');

            const price = 450; 
            
            if (payMethod === 'wallet') {
                if (currentProfile.wallet_balance < price) return alert('رصيد المحفظة لا يكفي! يرجى الشحن أولاً.');
                let newBalance = currentProfile.wallet_balance - price;
                await supabaseClient.from('profiles').update({ wallet_balance: newBalance }).eq('id', currentUser.id);
                currentProfile.wallet_balance = newBalance;
                document.getElementById('clientWallet').innerText = formatMoney(newBalance);
            }

            const otp = Math.floor(1000 + Math.random() * 9000).toString();

            await supabaseClient.from('orders').insert({
                client_id: currentUser.id,
                pickup_address: pickup, dropoff_address: dropoff, cargo_type: 'نقل خفيف',
                price: price, otp_code: otp, pickup_lat: selectedLat, pickup_lng: selectedLng,
                payment_method: payMethod
            });

            alert('تم إرسال الطلب! كود التسليم: ' + otp);
            renderClientOrders();
        }

        async function renderClientOrders() {
            let { data: orders } = await supabaseClient.from('orders').select('*').eq('client_id', currentUser.id).order('created_at', { ascending: false });
            
            let html = '';
            for (let o of (orders || [])) {
                let mapDiv = o.status === 'accepted' || o.status === 'picked_up' ? `<div id="clientOrderMap_${o.id}" class="mt-2" style="height:200px;"></div>` : '';
                
                let ratingHtml = '';
                if (o.status === 'delivered' && !o.rating) {
                    ratingHtml = `
                    <div class="mt-3 bg-yellow-50 p-2 rounded-lg text-center border border-yellow-200">
                        <p class="text-sm font-bold mb-1">قيّم السائق:</p>
                        <div class="flex justify-center gap-2" dir="ltr">
                            ${[1,2,3,4,5].map(star => `<span onclick="submitRating('${o.id}', ${star})" class="star-btn">★</span>`).join('')}
                        </div>
                    </div>`;
                } else if (o.rating) {
                    ratingHtml = `<p class="text-sm text-yellow-600 font-bold mt-2">تقييمك: ${'★'.repeat(o.rating)}</p>`;
                }

                html += `
                <div class="bg-white p-4 rounded-xl shadow-sm mb-3 border-r-4 ${o.status === 'pending' ? 'border-yellow-500' : o.status === 'delivered' ? 'border-green-500' : 'border-blue-500'}">
                    <div class="flex justify-between">
                        <span class="font-bold text-gray-800">${o.cargo_type}</span>
                        <span class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600">${getStatusText(o.status)}</span>
                    </div>
                    <p class="text-sm mt-2 text-gray-600">📍 من: ${o.pickup_address} <br> 🏁 إلى: ${o.dropoff_address}</p>
                    <p class="font-bold mt-2 text-yellow-600">${formatMoney(o.price)}</p>
                    <p class="text-xs text-blue-600 font-bold">الدفع: ${getPaymentText(o.payment_method)}</p>
                    ${mapDiv}
                    ${ratingHtml}
                </div>`;
            }
            document.getElementById('clientOrders').innerHTML = html || '<p class="text-gray-500 text-center">لا يوجد طلبات</p>';
            (orders || []).forEach(o => { if (o.status === 'accepted' || o.status === 'picked_up') initClientLiveTracking(o); });
        }

        async function initClientLiveTracking(order) {
            setTimeout(() => {
                let el = document.getElementById(`clientOrderMap_${order.id}`);
                if (!el || !el.offsetParent) return;

                let cMap = L.map(el).setView([order.pickup_lat, order.pickup_lng], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(cMap);
                L.marker([order.pickup_lat, order.pickup_lng]).addTo(cMap).bindPopup('التحميل');
                
                let dMarker = null;
                if (order.driver_lat && order.driver_lng) {
                    dMarker = L.marker([order.driver_lat, order.driver_lng], { icon: L.divIcon({ className: 'custom-truck-icon', html: '🚚', iconSize: [30,30], iconAnchor: [15,15] }) }).addTo(cMap).bindPopup('السائق');
                }

                supabaseClient.channel('client_track_' + order.id)
                  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `id=eq.${order.id}` }, payload => {
                      let newOrder = payload.new;
                      if (newOrder.driver_lat && newOrder.driver_lng) {
                          if (dMarker) {
                              dMarker.setLatLng([newOrder.driver_lat, newOrder.driver_lng]);
                              cMap.panTo([newOrder.driver_lat, newOrder.driver_lng]);
                          } else {
                              dMarker = L.marker([newOrder.driver_lat, newOrder.driver_lng], { icon: L.divIcon({ className: 'custom-truck-icon', html: '🚚', iconSize: [30,30], iconAnchor: [15,15] }) }).addTo(cMap);
                          }
                      }
                  }).subscribe();
            }, 500);
        }

        // --- السائق ---
        async function renderDriverOrders() {
            try {
                let { data: myOrders, error: err1 } = await supabaseClient.from('orders').select('*').eq('driver_id', currentUser.id).neq('status', 'delivered').order('created_at', { ascending: false });
                if(err1) throw err1;
                
                document.getElementById('driverMyOrders').innerHTML = (myOrders || []).map(o => `
                    <div class="bg-white p-4 rounded-xl shadow-sm mb-3 border-r-4 border-blue-500">
                        <p class="font-bold text-gray-800">${o.pickup_address} ➡️ ${o.dropoff_address}</p>
                        <p class="text-sm text-gray-500 mt-1">الحالة: ${getStatusText(o.status)}</p>
                        <div id="driverMap_${o.id}" class="mt-2" style="height: 200px;"></div>
                        ${o.status === 'accepted' ? `<button onclick="updateOrder('${o.id}', 'picked_up')" class="w-full bg-blue-500 text-white mt-3 py-2 rounded-lg font-bold">تأكيد الاستلام</button>` : ''}
                        ${o.status === 'picked_up' ? `<button onclick="deliverOrder('${o.id}')" class="w-full bg-green-500 text-white mt-3 py-2 rounded-lg font-bold">تسليم</button>` : ''}
                    </div>
                `).join('') || '<p class="text-gray-500 text-center">لا يوجد رحلات</p>';

                (myOrders || []).forEach(o => drawDriverRoute(o));

                let { data: pendingOrders, error: err2 } = await supabaseClient.from('orders').select('*').eq('status', 'pending');
                if(err2) throw err2;
                
                let filteredOrders = pendingOrders || [];
                
                document.getElementById('driverPendingOrders').innerHTML = filteredOrders.map(o => {
                    const netEarnings = (o.price * 0.98).toFixed(2);
                    return `
                    <div class="bg-white p-4 rounded-xl shadow-sm mb-3">
                        <p class="font-bold text-gray-800 text-sm">📍 ${o.pickup_address} <br> 🏁 ${o.dropoff_address}</p>
                        <p class="text-yellow-600 font-bold my-2">السعر: ${formatMoney(o.price)}</p>
                        <p class="text-green-600 font-bold text-sm mb-2">صافي أرباحك: ${formatMoney(netEarnings)}</p>
                        <button onclick="acceptOrder('${o.id}')" class="w-full bg-black hover:bg-gray-800 text-white py-2 rounded-lg text-sm font-bold">قبول الطلب</button>
                    </div>
                `}).join('') || '<p class="text-gray-500 text-center text-sm">لا يوجد طلبات متاحة حالياً</p>';

            } catch (err) {
                console.error(err);
                document.getElementById('driverPendingOrders').innerHTML = '<p class="text-red-500 text-center text-sm">حدث خطأ في جلب الطلبات. جرب التحديث.</p>';
            }
        }

        async function drawDriverRoute(order) {
            setTimeout(() => {
                let el = document.getElementById(`driverMap_${order.id}`);
                if (!el || !el.offsetParent) return;

                if (driverMap) driverMap.remove();
                driverMap = L.map(el).setView([order.pickup_lat, order.pickup_lng], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(driverMap);

                navigator.geolocation.getCurrentPosition(pos => {
                    let start = [pos.coords.latitude, pos.coords.longitude];
                    let end = [order.pickup_lat, order.pickup_lng];
                    if (driverRouting) driverMap.removeControl(driverRouting);
                    driverRouting = L.Routing.control({
                        waypoints: [L.latLng(start), L.latLng(end)],
                        routeWhileDragging: false, show: false, addWaypoints: false, fitSelectedRoutes: true, lineOptions: { styles: [{color: '#f59e0b', weight: 5}] }
                    }).addTo(driverMap);
                });

                if (watchId) navigator.geolocation.clearWatch(watchId);
                watchId = navigator.geolocation.watchPosition(pos => {
                    supabaseClient.from('orders').update({ driver_lat: pos.coords.latitude, driver_lng: pos.coords.longitude }).eq('id', order.id).then();
                }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
            }, 500);
        }

        async function acceptOrder(id) {
            if(!confirm('قبول الرحلة؟')) return;
            await supabaseClient.from('orders').update({ status: 'accepted', driver_id: currentUser.id }).eq('id', id);
            if (driverPollingInterval) clearInterval(driverPollingInterval); // وقف التحديث التلقائي عشان الخريطة متتلخبطش
            renderDriverOrders();
        }

        async function updateOrder(id, status) {
            await supabaseClient.from('orders').update({ status: status }).eq('id', id);
            renderDriverOrders();
        }

        async function deliverOrder(id) {
            const otp = prompt('أدخل كود التسليم:');
            if(!otp) return;
            const { data: isValid } = await supabaseClient.rpc('verify_delivery', { p_order_id: id, p_otp: otp });
            if(!isValid) return alert('كود خاطئ!');

            await supabaseClient.from('orders').update({ status: 'delivered' }).eq('id', id);
            if (watchId) navigator.geolocation.clearWatch(watchId);
            alert('تم التسليم بنجاح!');
            
            let newBalance = Number(currentProfile.wallet_balance) + 450;
            await supabaseClient.from('profiles').update({ wallet_balance: newBalance }).eq('id', currentUser.id);
            currentProfile.wallet_balance = newBalance;
            document.getElementById('driverWallet').innerText = formatMoney(newBalance);
            
            // رجع التحديث التلقائي بعد التسليم
            if (driverPollingInterval) clearInterval(driverPollingInterval);
            driverPollingInterval = setInterval(renderDriverOrders, 10000);
            
            renderDriverOrders();
        }

        // --- الأدمن ---
        async function loadAdminData() {
            let { data: users } = await supabaseClient.from('profiles').select('*');
            document.getElementById('adminUsersList').innerHTML = (users || []).map(u => `
                <div class="bg-white p-3 rounded-lg mb-2 text-sm border-r-4 ${u.role === 'admin' ? 'border-red-500' : u.role === 'driver' ? 'border-blue-500' : 'border-green-500'}">
                    <b>${u.full_name}</b> (${u.role})<br> 📞 ${u.phone}
                    ${u.role === 'driver' && !u.approved ? `<button onclick="approveDriver('${u.id}')" class="mt-2 w-full bg-green-500 text-white py-1 rounded">✅ موافقة</button>` : ''}
                </div>
            `).join('');

            let { data: orders } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
            
            let activeOrders = (orders || []).filter(o => o.status === 'accepted' || o.status === 'picked_up');
            
            if (activeOrders.length > 0) {
                let liveHtml = activeOrders.map(o => `
                    <div class="bg-gray-50 p-3 rounded-lg shadow-sm mb-3 border border-blue-200">
                        <p class="font-bold text-sm text-blue-800">شحنة #${o.id.slice(0,4)} (${o.status === 'accepted' ? 'في الطريق للتحميل' : 'جاري النقل'})</p>
                        <div id="adminLiveMap_${o.id}" style="height: 200px; border-radius: 8px; margin-top: 8px; z-index:1;"></div>
                    </div>
                `).join('');
                document.getElementById('adminLiveTracking').innerHTML = liveHtml;
                activeOrders.forEach(o => initAdminLiveTracking(o));
            } else {
                document.getElementById('adminLiveTracking').innerHTML = '<p class="text-gray-500 text-sm">لا يوجد شحنات نشطة حالياً</p>';
            }

            document.getElementById('adminOrdersList').innerHTML = (orders || []).map(o => `
                <div class="bg-white p-3 rounded-lg shadow-sm mb-2 text-sm border-r-4 border-yellow-500">
                    <div class="flex justify-between font-bold"><span>${o.cargo_type}</span><span class="text-yellow-600">${formatMoney(o.price)}</span></div>
                    <p class="text-gray-500 mt-1">من: ${o.pickup_address} <br> إلى: ${o.dropoff_address}</p>
                    <p class="text-xs mt-1 font-bold text-blue-600">الدفع: ${getPaymentText(o.payment_method)}</p>
                    ${o.rating ? `<p class="text-xs mt-1 font-bold text-yellow-600">تقييم العميل: ${'★'.repeat(o.rating)}</p>` : ''}
                    <p class="text-xs mt-1 text-gray-400">الحالة: ${getStatusText(o.status)}</p>
                </div>
            `).join('');
        }

        function initAdminLiveTracking(order) {
            setTimeout(() => {
                let el = document.getElementById(`adminLiveMap_${order.id}`);
                if (!el) return;

                let aMap = L.map(el).setView([order.pickup_lat, order.pickup_lng], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(aMap);
                L.marker([order.pickup_lat, order.pickup_lng]).addTo(aMap).bindPopup('التحميل');
                
                let dMarker = null;
                if (order.driver_lat && order.driver_lng) {
                    dMarker = L.marker([order.driver_lat, order.driver_lng], { icon: L.divIcon({ className: 'custom-truck-icon', html: '🚚', iconSize: [30,30], iconAnchor: [15,15] }) }).addTo(aMap).bindPopup('السائق');
                }

                supabaseClient.channel('admin_track_' + order.id)
                  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `id=eq.${order.id}` }, payload => {
                      let newOrder = payload.new;
                      if (newOrder.driver_lat && newOrder.driver_lng) {
                          if (dMarker) {
                              dMarker.setLatLng([newOrder.driver_lat, newOrder.driver_lng]);
                              aMap.panTo([newOrder.driver_lat, newOrder.driver_lng]);
                          } else {
                              dMarker = L.marker([newOrder.driver_lat, newOrder.driver_lng], { icon: L.divIcon({ className: 'custom-truck-icon', html: '🚚', iconSize: [30,30], iconAnchor: [15,15] }) }).addTo(aMap);
                          }
                      }
                  }).subscribe();
            }, 500);
        }

        async function approveDriver(userId) {
            await supabaseClient.from('profiles').update({ approved: true }).eq('id', userId);
            alert('تم الاعتماد!'); loadAdminData();
        }

        function showScreen(id) {
            ['authScreen', 'clientScreen', 'driverScreen', 'adminScreen', 'approvalScreen'].forEach(s => {
                let el = document.getElementById(s); if(el) el.classList.add('hide');
            });
            let target = document.getElementById(id); if(target) target.classList.remove('hide');
        }

        async function logout() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (driverPollingInterval) clearInterval(driverPollingInterval);
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function getStatusText(s) {
            return { pending: 'انتظار', accepted: 'تم القبول', picked_up: 'جاري النقل', delivered: 'تم التسليم' }[s] || s;
        }
        function getPaymentText(m) {
            return { cash: 'كاش', instapay: 'إنستا باي', visa: 'فيزا', wallet: 'محفظة' }[m] || 'كاش';
        }

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) loadApp(session.user); else showScreen('authScreen');
        });
    </script>
</body>
</html>
